<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probar Subida de Archivos a la Red Synchrontainer</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0056b3; }
        form { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"], select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        button:hover { background-color: #218838; }
        #response { margin-top: 20px; padding: 15px; border: 1px solid #eee; background-color: #f9f9f9; border-radius: 5px; min-height: 50px; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Subir Archivo a la Red</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="port">Puerto de Conexión:</label>
                <input type="text" id="port" value="5001" required>
            </div>

            <div class="form-group">
                <label for="uid">ID del Contenedor Destino:</label>
                <input type="text" id="uid" value="c1" required>
            </div>

            <div class="form-group">
                <label for="folder">Carpeta de Destino:</label>
                <select id="folder" name="folder">
                    <option value="public" selected>Public</option>
                    <option value="private">Private</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="fileInput">Selecciona el archivo:</label>
                <input type="file" id="fileInput" required>
            </div>

            <button type="submit">Subir Archivo</button>
        </form>

        <div id="response">Esperando subida...</div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const port = document.getElementById('port').value;
            const uid = document.getElementById('uid').value;
            const folder = document.getElementById('folder').value; 
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const responseDiv = document.getElementById('response');

            if (!file) { /* ... */ return; }

            const filename = file.name;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('folder', folder); 

            const targetUrl = `http://localhost:${port}/upload/${uid}/${filename}`;
            responseDiv.innerHTML = `Subiendo '${filename}' a la carpeta '${folder}' de ${uid}...`;

            try {
                const response = await fetch(targetUrl, { method: 'POST', body: formData });
                const data = await response.json();
                if (response.ok) {
                    responseDiv.innerHTML = `<p style="color: green;">${data.message || 'Éxito!'}</p>`;
                } else {
                    responseDiv.innerHTML = `<p style="color: red;">Error: ${data.error || 'Algo salió mal'}</p>`;
                }
            } catch (error) { /* ... */ }
        });
    </script>
</body>
</html>
